<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,follow">
<meta name="theme-color" content="#0a0a0a">
<title>Страница не найдена - гид MIX-SMM.RU</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Outfit:wght@400;500;600&display=swap">
<style>
:root{--bg:#0a0a0a;--bg2:#101010;--surf:#1c1c1c;--bdr:rgba(68,175,68,.14);--bdr2:rgba(68,175,68,.26);--g:#44b844;--tx:#ededed;--tx2:#9aa29a;--ease:cubic-bezier(.22,1,.36,1)}
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:radial-gradient(90% 60% at 50% 0%,rgba(68,184,68,.08),transparent 65%),var(--bg);color:var(--tx);font-family:'Outfit',sans-serif;display:flex;align-items:center;justify-content:center;padding:32px 20px;text-align:center;-webkit-font-smoothing:antialiased}
.wrap{max-width:520px}
.code{font-family:'Manrope',sans-serif;font-weight:800;font-size:clamp(76px,22vw,132px);line-height:1;letter-spacing:-.05em;background:linear-gradient(180deg,#ffffff,#8f8f8f);-webkit-background-clip:text;background-clip:text;color:transparent}
h1{font-family:'Manrope',sans-serif;font-weight:700;font-size:clamp(20px,5vw,28px);line-height:1.2;letter-spacing:-.02em;margin:6px 0 10px}
p{font-size:15px;line-height:1.65;color:var(--tx2);margin-bottom:26px}
.actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:13px 22px;border-radius:10px;font-size:14px;font-weight:700;text-decoration:none;transition:transform .18s var(--ease),background .18s var(--ease),border-color .18s var(--ease)}
.btn.p{background:var(--g);color:#07110a;box-shadow:0 10px 28px rgba(68,184,68,.22)}
.btn.p:hover{background:#4ecb4e;transform:translateY(-1px)}
.btn.s{border:1px solid var(--bdr2);color:var(--tx)}
.btn.s:hover{border-color:var(--g);background:var(--surf);transform:translateY(-1px)}
.note{margin-top:28px;font-size:12px;color:#5b635b}
.note a{color:var(--tx2);text-decoration:none;border-bottom:1px solid var(--bdr)}
.note a:hover{color:var(--tx)}
</style>
</head>
<body>
<div class="wrap">
  <div class="code">404</div>
  <h1>Такой страницы нет</h1>
  <p>Возможно, ссылка устарела или в адресе опечатка. Гид по платформе и заказ услуг доступны по кнопкам ниже.</p>
  <div class="actions">
    <a class="btn p" href="https://guide.mix-smm.ru/">Вернуться в гид</a>
    <a class="btn s" href="https://mix-smm.ru/order" target="_blank" rel="noopener">Заказать без регистрации</a>
  </div>
  <div class="note">Отлёжка аккаунтов и каналов: <a href="https://otlezhka.mix-smm.ru/" target="_blank" rel="noopener">otlezhka.mix-smm.ru</a></div>
</div>
</body>
</html>
